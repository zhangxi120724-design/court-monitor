name: Kallang Tennis Monitor

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - run: go mod download
      - name: Run monitor check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PERFECTGYM_BASE_URL: ${{ secrets.PERFECTGYM_BASE_URL }}
          PERFECTGYM_EMAIL: ${{ secrets.PERFECTGYM_EMAIL }}
          PERFECTGYM_PASSWORD: ${{ secrets.PERFECTGYM_PASSWORD }}
        run: go run ./cmd/monitor
